name: Testes do pipeline Olist
on:
  push:
  pull_request:
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q --cov=pipeline --cov-report=term-missing --cov-fail-under=60
